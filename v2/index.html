<!DOCTYPE html>
<html lang="vi">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Notary Office Simulator v2</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: #EDE4C8;
	background: #0E131D;
	overflow: hidden;
	touch-action: none;
	font-family: Georgia, 'Times New Roman', serif;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	left: 0;
	right: 0;
	top: 0;
	bottom: 0;
	background: linear-gradient(160deg, #0E131D 0%, #182232 100%);
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status::before {
	content: '';
	position: absolute;
	inset: 14px;
	border: 1px solid rgba(212, 175, 55, 0.35);
	pointer-events: none;
}

#status::after {
	content: '';
	position: absolute;
	inset: 20px;
	border: 1px solid rgba(212, 175, 55, 0.18);
	pointer-events: none;
}

#brand-badge {
	font-size: 40px;
	color: #D4AF37;
	line-height: 1;
	margin-bottom: 10px;
}

#brand-title {
	font-size: 30px;
	letter-spacing: 3px;
	color: #F2E7C3;
	text-align: center;
	margin: 0 12px;
}

#brand-sub {
	font-size: 14px;
	letter-spacing: 1px;
	color: rgba(237, 228, 200, 0.65);
	margin-top: 6px;
	text-align: center;
}

#status-progress-wrap {
	width: min(420px, 80vw);
	margin-top: 34px;
}

#status-progress {
	width: 100%;
	height: 8px;
	appearance: none;
	-webkit-appearance: none;
	display: none;
}

#status-progress::-webkit-progress-bar {
	background-color: rgba(212, 175, 55, 0.15);
	border-radius: 4px;
}

#status-progress::-webkit-progress-value {
	background-color: #D4AF37;
	border-radius: 4px;
	transition: width 0.25s ease;
}

#status-progress::-moz-progress-bar {
	background-color: #D4AF37;
	border-radius: 4px;
}

#status-text {
	margin-top: 12px;
	font-size: 14px;
	color: rgba(237, 228, 200, 0.85);
	text-align: center;
	min-height: 18px;
}

#loading-tip {
	margin-top: 26px;
	max-width: min(460px, 84vw);
	background: rgba(212, 175, 55, 0.07);
	border: 1px solid rgba(212, 175, 55, 0.25);
	border-radius: 8px;
	padding: 10px 16px;
	font-size: 13.5px;
	line-height: 1.45;
	color: rgba(237, 228, 200, 0.8);
	text-align: center;
	transition: opacity 0.4s ease;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: Arial, sans-serif;
	line-height: 1.4;
	margin: 1.5rem 2rem 0;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
	display: none;
	max-width: min(560px, 86vw);
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Trình duyệt của bạn không hỗ trợ thẻ canvas.
		</canvas>

		<noscript>
			Trình duyệt của bạn không hỗ trợ JavaScript.
		</noscript>

		<div id="status">
			<div id="brand-badge">&#9878;</div>
			<div id="brand-title">NOTARY OFFICE SIMULATOR v2</div>
			<div id="brand-sub">Văn phòng Công chứng Số &middot; Phiên bản Web</div>
			<div id="status-progress-wrap">
				<progress id="status-progress"></progress>
				<div id="status-text">Đang khởi tạo động cơ WebGL 3D...</div>
			</div>
			<div id="loading-tip">Mẹo: Nhấn [Space] vào đầu ngày (07:00) để tua nhanh tới 08:00 và đón khách ngay.</div>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const engine = new Engine();

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusText = document.getElementById('status-text');
	const statusNotice = document.getElementById('status-notice');
	const tipBox = document.getElementById('loading-tip');

	const TIPS = [
		'Mẹo: Nhấn [Space] vào đầu ngày (07:00) để tua nhanh tới 08:00 và đón khách ngay.',
		'Mẹo: Dùng phím [1] bật Kính lúp soi chi tiết con dấu, phím [2] bật Đèn UV phát hiện mực ẩn trên CCCD.',
		'Mẹo: Phát hiện điểm bất hợp lý? Nhấp vào 2 vị trí mâu thuẫn để nối chỉ Bezier lập biên bản.',
		'Mẹo: Luôn để ý chỉ số Kiên nhẫn trên Queue Watch để tránh khách bỏ về.',
	];
	let tipIdx = 0;
	const tipTimer = setInterval(function () {
		tipIdx = (tipIdx + 1) % TIPS.length;
		tipBox.style.opacity = '0';
		setTimeout(function () {
			tipBox.textContent = TIPS[tipIdx];
			tipBox.style.opacity = '1';
		}, 400);
	}, 3500);

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			clearInterval(tipTimer);
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach(function (line) {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function progressText(pct) {
		if (pct < 35) {
			return 'Đang khởi tạo động cơ WebGL 3D...';
		}
		if (pct < 85) {
			return 'Đang tải hồ sơ & mô hình văn phòng (' + pct + '%...)';
		}
		return 'Đang mở cửa văn phòng công chứng...';
	}

	engine.startGame({
		'executable': 'index',
		'canvas': document.getElementById('canvas'),
		'onProgress': function (current, total) {
			if (current > 0 && total > 0) {
				statusProgress.value = current;
				statusProgress.max = total;
				const pct = Math.floor(current / total * 100);
				statusText.textContent = progressText(pct);
			}
		},
	}).then(function () {
		setStatusMode('hidden');
	}, function (err) {
		console.error(err);
		let msg = (err && err.message) ? err.message : String(err);
		if (/webgl|WebGL/i.test(msg)) {
			msg = 'Trình duyệt không hỗ trợ WebGL2. Hãy bật Tăng tốc phần cứng (Hardware Acceleration) trong cài đặt trình duyệt, hoặc thử Chrome / Edge phiên bản mới nhất.';
		}
		setStatusNotice(msg);
		setStatusMode('notice');
	});

	setStatusMode('progress');
}());
		</script>
	</body>
</html>
